# ablation: support structure only (conflict + restatement off). checks whether
# it's the argument content helping or just any dense reward.
run_id: e2_ablation
condition: ablation
seed: 1

model: Qwen/Qwen2.5-3B-Instruct
load_in_4bit: true
lora: {r: 16, alpha: 32, dropout: 0.05}

grpo:
  num_generations: 8
  learning_rate: 1.0e-5
  max_steps: 400
  max_completion_length: 1024
  kl_coef: 0.04

reward:
  lambda_: 0.5
  use_structure: true
  use_conflict: false
  use_restatement: false

ari:
  window: null
  batch_size: 64

data:
  splits: docs/splits.json
out: results/{run_id}
